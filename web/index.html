<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0d1117]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src blob:; font-src 'self' data:;">
<title>Diff review</title>
</head>
<body class="h-full overflow-hidden bg-review-bg text-review-text antialiased">
<div id="root-layout" class="flex h-full w-full flex-col">
  <div class="flex min-h-12 items-center justify-between gap-3 border-b border-review-border bg-[#010409] px-4 py-2">
    <div class="min-w-0 flex items-center gap-3">
      <button id="toggle-sidebar-button" class="cursor-pointer rounded-md px-2 py-1 text-[11px] font-medium text-review-muted hover:bg-[#161b22] hover:text-review-text">Review plan</button>
      <div class="min-w-0">
        <button id="window-title" type="button" class="flex max-w-full cursor-default items-center gap-1 truncate text-left text-sm font-semibold text-white">Diff review</button>
        <div class="flex min-w-0 items-center gap-2">
          <div id="repo-root" class="truncate text-[11px] text-review-muted"></div>
          <button id="autosave-status" type="button" disabled aria-live="polite" class="shrink-0 cursor-default rounded px-1.5 py-0.5 text-[10px] font-medium text-[#3fb950]">Saved</button>
          <span id="session-notice" class="hidden shrink-0 text-[10px] font-medium text-[#d29922]"></span>
        </div>
      </div>
    </div>
    <div class="flex min-w-0 items-center gap-2">
      <div id="summary" class="hidden min-w-0 max-w-[34rem] text-[11px] text-review-muted xl:block"></div>
      <button id="github-thread-count" type="button" title="Open GitHub review threads" class="hidden cursor-pointer rounded px-2 py-1 text-[11px] text-review-muted hover:bg-[#161b22] hover:text-review-text"></button>
      <button id="submit-button" class="cursor-pointer rounded-md border border-[#1f6feb]/40 bg-[#1f6feb] px-4 py-1.5 text-xs font-semibold text-white shadow-[0_0_0_1px_rgba(255,255,255,0.04)] hover:bg-[#388bfd] disabled:cursor-default disabled:opacity-50 disabled:hover:bg-[#1f6feb]">Submit review</button>
    </div>
  </div>

  <div id="content-layout" class="flex min-h-0 flex-1">
    <aside id="sidebar" tabindex="-1" class="flex min-h-0 shrink-0 flex-col border-r border-review-border bg-[#0d1117]" style="width: 280px; min-width: 280px; flex-basis: 280px; overflow: hidden;">
    <div class="border-b border-review-border px-3 py-3">
      <div id="sidebar-title" class="hidden"></div>
      <div class="hidden">
        <button id="tab-review-map-button" class="rounded px-2 py-1 text-[11px] font-medium text-review-text">Map</button>
        <button id="tab-files-button" class="rounded px-2 py-1 text-[11px] font-medium text-review-muted">Files</button>
        <button id="tab-findings-button" class="rounded px-2 py-1 text-[11px] font-medium text-review-muted">Findings</button>
      </div>
      <div id="scope-controls" class="hidden" aria-hidden="true">
        <button id="scope-diff-button" type="button" tabindex="-1"></button>
        <button id="scope-last-commit-button" type="button" tabindex="-1"></button>
        <button id="scope-commit-button" type="button" tabindex="-1"></button>
        <button id="scope-all-button" type="button" tabindex="-1"></button>
      </div>
      <select id="commit-select" class="hidden" tabindex="-1" aria-hidden="true"></select>
      <input id="sidebar-search-input" type="text" spellcheck="false" autocomplete="off" placeholder="Filter changed files..." aria-label="Filter changed files" class="w-full rounded-lg border border-review-border bg-review-panel px-3.5 py-2.5 text-sm text-review-text outline-none placeholder:text-review-muted focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>
    <div id="file-tree" class="scrollbar-thin min-h-0 flex-1 overflow-auto px-2 pb-2"></div>
  </aside>

    <main id="main-pane" tabindex="-1" class="flex min-h-0 min-w-0 flex-1 flex-col bg-[#0d1117]">
    <div class="flex items-center justify-between gap-4 border-b border-review-border bg-[#0d1117] px-4 py-2">
      <div class="min-w-0">
        <div id="current-file-label" class="truncate text-sm font-semibold text-white"></div>
        <div id="mode-hint" class="mt-0.5 text-[11px] text-review-muted"></div>
      </div>
      <div class="flex items-center gap-1 rounded-lg border border-review-border bg-[#010409] p-1">
        <button id="toggle-wrap-button" class="cursor-pointer rounded-md border border-transparent bg-transparent px-3 py-1 text-xs font-medium text-review-text hover:bg-[#21262d]">Wrap lines</button>
        <button id="toggle-unchanged-button" class="cursor-pointer rounded-md border border-transparent bg-transparent px-3 py-1 text-xs font-medium text-review-text hover:bg-[#21262d]">Changed areas</button>
        <button id="file-comment-button" class="cursor-pointer rounded-md border border-transparent bg-transparent px-3 py-1 text-xs font-medium text-review-text hover:bg-[#21262d]">Add comment</button>
        <button id="toggle-reviewed-button" aria-pressed="false" title="Mark this file reviewed and advance" class="cursor-pointer rounded-md border border-transparent bg-transparent px-3 py-1 text-xs font-medium text-review-text hover:bg-[#21262d]">Reviewed</button>
      </div>
    </div>
    <div id="file-comments-container" class="hidden border-b border-review-border bg-[#0d1117] px-4 py-0"></div>
    <div id="editor-container" class="min-h-0 min-w-0 flex-1"></div>
    <div id="chapter-brief-container" class="chapter-brief-view scrollbar-thin hidden min-h-0 min-w-0 flex-1 overflow-auto bg-[#0d1117]"></div>
    </main>
    <aside id="insight-panel" tabindex="-1" class="hidden min-h-0 shrink-0 flex-col border-l border-review-border bg-[#0d1117] review-checkout-drawer">
      <div class="border-b border-review-border px-4 py-2">
        <div id="insight-panel-title" class="truncate text-xs font-medium text-review-muted">Submit review</div>
        <div id="source-label" class="hidden"></div>
        <div id="analysis-status" class="hidden"></div>
      </div>
      <div id="insight-content" class="scrollbar-thin min-h-0 flex-1 overflow-auto px-4 py-3"></div>
    </aside>
  </div>
  <aside id="pr-context-drawer" aria-hidden="true" class="review-pr-context-drawer hidden">
    <div class="flex items-center justify-between border-b border-review-border px-4 py-3">
      <div class="min-w-0">
        <div class="truncate text-sm font-semibold text-white">Pull request context</div>
        <div id="pr-context-sync" class="mt-0.5 text-[10px] text-review-muted"></div>
      </div>
      <div class="flex items-center gap-1">
        <button id="pr-context-refresh" type="button" aria-label="Refresh GitHub context" title="Refresh GitHub context" class="cursor-pointer rounded p-2 text-review-muted hover:bg-[#21262d] hover:text-review-text">↻</button>
        <button id="pr-context-close" type="button" aria-label="Close PR context" title="Close" class="cursor-pointer rounded p-2 text-review-muted hover:bg-[#21262d] hover:text-review-text">×</button>
      </div>
    </div>
    <div class="flex items-center gap-4 border-b border-review-border px-4 pt-2">
      <button id="pr-context-overview-tab" type="button" class="review-context-tab">Overview</button>
      <button id="pr-context-threads-tab" type="button" class="review-context-tab">Threads</button>
    </div>
    <div id="pr-context-content" class="scrollbar-thin min-h-0 flex-1 overflow-auto px-4 py-4"></div>
  </aside>
</div>

<script defer src="./csp-monitor.js"></script>
<script defer src="./dist/review.js"></script>
</body>
</html>
